<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Source BibTeX Enricher (Fixed Routing)</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --primary-color: #4a90e2;
            --border-color: #ccc;
            --success-bg: #e8f5e9;
            --card-bg: #ffffff;
            --textarea-bg: #fafafa;
            --error-color: #d32f2f;
        }

        [data-theme="dark"] {
            --bg-color: #181a1b;
            --text-color: #e8e8e8;
            --primary-color: #5b9ee6;
            --border-color: #444;
            --success-bg: #1e3a23;
            --card-bg: #242424;
            --textarea-bg: #1e1e1e;
            --error-color: #ff6b6b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.8rem;}
        p.subtitle { margin-bottom: 1.5rem; color: #888; }
        
        .top-btns { display: flex; gap: 0.5rem; }
        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .settings-panel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .settings-panel label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem;}
        .settings-panel input { 
            width: 100%; padding: 0.5rem; margin-bottom: 1rem; 
            border: 1px solid var(--border-color); border-radius: 4px;
            background: var(--textarea-bg); color: var(--text-color);
        }
        .settings-note { font-size: 0.8rem; color: #666; margin-top: -0.5rem; margin-bottom: 1rem; display: block;}

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%; height: 150px; padding: 0.75rem;
            font-family: monospace; border: 1px solid var(--border-color);
            border-radius: 4px; resize: vertical; box-sizing: border-box;
            background-color: var(--textarea-bg); color: var(--text-color);
        }

        .primary-btn {
            background-color: var(--primary-color); color: white;
            border: none; padding: 0.75rem; font-size: 1rem;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .primary-btn:hover { opacity: 0.9; }
        .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #status-msg { font-weight: bold; text-align: center; margin-bottom: 0.5rem;}
        
        #error-log { 
            color: var(--error-color); font-size: 0.85rem; text-align: left; 
            background: rgba(255, 0, 0, 0.05); padding: 0.5rem;
            border-radius: 4px; display: none; font-family: monospace;
            white-space: pre-wrap; word-break: break-all;
        }
        
        .results-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem; margin-top: 1rem;
        }
        .result-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .result-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;
        }
        .result-header h3 { margin: 0; color: var(--primary-color); font-size: 1.1rem; }
        .confidence { font-size: 0.8rem; color: #4caf50; background: var(--success-bg); padding: 0.2rem 0.5rem; border-radius: 12px; font-weight: bold;}
        .result-card textarea { height: 250px; font-size: 0.85rem;}
    </style>

    <script src="https://cdn.jsdelivr.net/gh/ORCID/bibtexParseJs@master/bibtexParse.js"></script>
    <script src="https://unpkg.com/string-similarity/umd/string-similarity.min.js"></script>
</head>
<body>

    <div class="header-container">
        <h1>📚 Multi-Source BibTeX Enricher</h1>
        <div class="top-btns">
            <button class="icon-btn" onclick="toggleSettings()">⚙️ Settings</button>
            <button id="theme-toggle" class="icon-btn" onclick="toggleTheme()">🌙 Dark</button>
        </div>
    </div>
    <p class="subtitle">Fixed Semantic Scholar 400 error and integrated WAF-bypassing proxies.</p>
    
    <div id="settings-panel" class="settings-panel">
        <label>Custom CORS Proxy URL (Optional)</label>
        <span class="settings-note">Leave empty to use built-in fallbacks. (e.g., https://corsproxy.io/?)</span>
        <input type="text" id="setting-proxy" placeholder="https://your-proxy.com/?url=">
        
        <label>Unpaywall Email (Required for Unpaywall)</label>
        <input type="email" id="setting-email" placeholder="you@example.com">
        
        <label>Elsevier Scopus API Key (Required for Scopus)</label>
        <input type="text" id="setting-scopus" placeholder="Paste Scopus API Key here...">
    </div>

    <div class="input-section">
        <textarea id="input-bib" placeholder="Paste BibTeX or paper title..."></textarea>
        <button id="enrich-btn" class="primary-btn" onclick="runEnrichment()">Search & Enrich</button>
    </div>
    
    <div id="status-msg"></div>
    <div id="error-log"></div>
    <div id="results-container" class="results-grid"></div>

    <script>
        const FUZZY_THRESHOLD = 0.70;
        let activeErrors = [];

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('theme-toggle');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme'); btn.textContent = '🌙 Dark';
            } else {
                html.setAttribute('data-theme', 'dark'); btn.textContent = '☀️ Light';
            }
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function logError(source, detailedMsg) {
            activeErrors.push(`[${source}] Failed. Trace:\n${detailedMsg}`);
            const el = document.getElementById('error-log');
            el.style.display = 'block';
            el.innerHTML = activeErrors.join('\n\n');
        }

        // --- FORTIFIED ROUTING WITH CORSProxy.io ---
        async function fetchWithFallback(url) {
            let trace = [];
            const customProxy = document.getElementById('setting-proxy').value.trim();
            
            // Re-ordered proxies to prioritize WAF-evading services
            let proxies = customProxy 
                ? [{ name: "Custom Proxy", prefix: customProxy }]
                : [
                    { name: "Direct", prefix: "" },
                    { name: "CorsProxy.io", prefix: "https://corsproxy.io/?" }, 
                    { name: "AllOrigins Get", prefix: "https://api.allorigins.win/get?url=" }
                ];

            for (const proxy of proxies) {
                // corsproxy.io works best when the URL is NOT encoded in the param. AllOrigins requires it to be encoded.
                let targetUrl;
                if (proxy.name === "CorsProxy.io") {
                    targetUrl = proxy.prefix + url; 
                } else {
                    targetUrl = proxy.prefix ? proxy.prefix + encodeURIComponent(url) : url;
                }

                try {
                    const res = await fetch(targetUrl);
                    if (res.ok) {
                        const rawText = await res.text();
                        
                        let contentToParse = rawText;
                        if (proxy.name === "AllOrigins Get") {
                            try {
                                const wrapper = JSON.parse(rawText);
                                contentToParse = wrapper.contents;
                            } catch(e) { /* ignore */ }
                        }

                        // Cloudflare WAF check
                        if (contentToParse.trim().startsWith('<') && !url.includes('arxiv.org')) {
                            const snippet = contentToParse.substring(0, 80).replace(/\n/g, ' ');
                            trace.push(` - ${proxy.name}: WAF Blocked (HTML: ${snippet}...)`);
                            continue;
                        }
                        return contentToParse; 
                    }
                    if (res.status === 429) throw new Error("429 Rate Limited");
                    if (res.status === 401) throw new Error("401 Unauthorized");
                    trace.push(` - ${proxy.name}: HTTP ${res.status}`);
                } catch (e) {
                    if (e.message.includes("429") || e.message.includes("401")) throw e;
                    let msg = e.message.includes("NetworkError") || e.message.includes("Failed to fetch") ? "CORS Blocked" : e.message;
                    trace.push(` - ${proxy.name}: ${msg}`);
                }
            }
            throw new Error(trace.join('\n'));
        }

        async function runEnrichment() {
            const input = document.getElementById('input-bib').value;
            const statusEl = document.getElementById('status-msg');
            const errorEl = document.getElementById('error-log');
            const resultsContainer = document.getElementById('results-container');
            const btn = document.getElementById('enrich-btn');

            resultsContainer.innerHTML = ''; 
            errorEl.style.display = 'none'; errorEl.innerHTML = ''; activeErrors = [];
            
            if (!input.trim()) return alert("Please paste some text first.");

            try {
                btn.disabled = true;
                statusEl.textContent = "Analyzing input format...";

                let originalTitle = ""; let originalAuthor = "";
                try {
                    const parsed = bibtexParse.toJSON(input);
                    if (parsed && parsed.length > 0 && parsed[0].entryTags && parsed[0].entryTags.title) {
                        originalTitle = parsed[0].entryTags.title;
                        originalAuthor = parsed[0].entryTags.author || "";
                    }
                } catch (e) {}

                if (!originalTitle) {
                    const lines = input.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                    if (lines.length === 0) throw new Error("Input is empty.");
                    originalTitle = lines[0]; originalAuthor = lines.length > 1 ? lines[1] : ""; 
                }

                const braceFreeTitle = originalTitle.replace(/[{}]/g, '').replace(/[\n\r]/g, ' ').trim();
                const braceFreeAuthor = originalAuthor.replace(/[{}]/g, '').replace(/[\n\r]/g, ' ').trim();

                statusEl.textContent = `Searching APIs for: "${braceFreeTitle.substring(0, 40)}..."`;

                const promises = [
                    fetchDBLP(braceFreeTitle, originalTitle, originalAuthor),
                    fetchOpenAlex(braceFreeTitle, originalTitle, originalAuthor),
                    fetchCrossRef(braceFreeTitle, braceFreeAuthor, originalTitle, originalAuthor),
                    fetchSemanticScholar(braceFreeTitle, originalTitle, originalAuthor),
                    fetchArxiv(braceFreeTitle, originalTitle, originalAuthor),
                    fetchUnpaywall(braceFreeTitle, originalTitle, originalAuthor),
                    fetchScopus(braceFreeTitle, originalTitle, originalAuthor)
                ];

                const results = await Promise.allSettled(promises);
                let foundAny = false;
                results.forEach(result => {
                    if (result.status === 'fulfilled' && result.value) {
                        renderResultCard(result.value); foundAny = true;
                    }
                });

                statusEl.textContent = foundAny ? "Search complete!" : "Search finished. See error logs below.";
            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        // --- Data Helpers ---
        function cleanString(str) { return str ? str.replace(/[{}]/g, '').replace(/[\n\r]/g, ' ').replace(/[.,:;'"-]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase() : ""; }
        
        function getFirstAuthorLastName(authorStr) {
            if (!authorStr) return "";
            let firstAuthor = authorStr.split(/\band\b/i)[0].trim();
            if (firstAuthor.includes(',')) return firstAuthor.split(',')[0].trim().toLowerCase();
            let parts = firstAuthor.split(/\s+/); return parts[parts.length - 1].trim().toLowerCase();
        }

        function generateCitationKey(apiAuthor, apiYear) {
            let lastName = "paper";
            if (apiAuthor) {
                let firstAuthor = apiAuthor.split(/\band\b/i)[0].trim();
                lastName = firstAuthor.includes(',') ? firstAuthor.split(',')[0].trim() : firstAuthor.split(/\s+/).pop().trim();
                lastName = lastName.replace(/[^a-zA-Z]/g, '').toLowerCase(); 
            }
            return lastName + (apiYear || "");
        }

        function evaluateMatch(originalTitle, originalAuthor, foundTitleRaw, foundAuthorRaw, foundVenue) {
            const foundTitle = cleanString(foundTitleRaw); const foundAuthor = cleanString(foundAuthorRaw);
            const origTitle = cleanString(originalTitle); const origAuthor = cleanString(originalAuthor);
            if (!foundTitle || !origTitle) return null;
            
            const titleSim = stringSimilarity.compareTwoStrings(origTitle, foundTitle);
            const authorSim = (origAuthor && foundAuthor) ? stringSimilarity.compareTwoStrings(origAuthor, foundAuthor) : 1.0; 
            const score = (titleSim * 0.8) + (authorSim * 0.2);
            
            if (score >= FUZZY_THRESHOLD && foundVenue) return { confidence: Math.round(score * 100) };
            return null;
        }

        function createEnrichedBibtex(updates) {
            const newEntry = { citationKey: generateCitationKey(updates.author, updates.year), entryType: 'misc', entryTags: {} };
            if (updates.title) newEntry.entryTags.title = `{${updates.title}}`;
            if (updates.author) newEntry.entryTags.author = `{${updates.author}}`;

            if (updates.venue) {
                const v = updates.venue.toLowerCase();
                if (v.includes('journal') || v.includes('transactions') || v.includes('arxiv')) {
                    newEntry.entryType = 'article'; newEntry.entryTags.journal = `{${updates.venue}}`;
                } else {
                    newEntry.entryType = 'inproceedings'; newEntry.entryTags.booktitle = `{${updates.venue}}`;
                }
            }

            const mapFields = ['doi', 'year', 'publisher', 'volume', 'number', 'pages', 'url', 'abstract', 'note'];
            mapFields.forEach(f => { if (updates[f]) newEntry.entryTags[f] = `{${updates[f]}}`; });
            return bibtexParse.toBibtex([newEntry], false);
        }

        function renderResultCard(data) {
            const container = document.getElementById('results-container');
            const card = document.createElement('div'); card.className = 'result-card';
            card.innerHTML = `<div class="result-header"><h3>${data.source}</h3><span class="confidence">${data.confidence}%</span></div><textarea readonly>${data.bibtex}</textarea>`;
            container.appendChild(card);
        }

        // --- FETCHERS ---

        async function fetchDBLP(qTitle, origTitle, origAuthor) {
            try {
                const raw = await fetchWithFallback(`https://dblp.org/search/publ/api?q=${encodeURIComponent(qTitle)}&format=json&h=1`);
                const hit = JSON.parse(raw)?.result?.hits?.hit?.[0]?.info;
                if (!hit) return null;
                const authorList = Array.isArray(hit.authors?.author) ? hit.authors.author.map(a=>a.text).join(" and ") : hit.authors?.author?.text;
                const venue = Array.isArray(hit.venue) ? hit.venue[0] : hit.venue;
                const match = evaluateMatch(origTitle, origAuthor, hit.title, authorList?.split(" and ")[0], venue);
                if (match) return { source: "DBLP", confidence: match.confidence, bibtex: createEnrichedBibtex({ title: hit.title, author: authorList, venue, doi: hit.doi, year: hit.year, pages: hit.pages, url: hit.ee }) };
            } catch (e) { logError("DBLP", e.message); } return null;
        }

        async function fetchOpenAlex(qTitle, origTitle, origAuthor) {
            try {
                const raw = await fetchWithFallback(`https://api.openalex.org/works?filter=title.search:${encodeURIComponent(qTitle)}&per-page=1`);
                const hit = JSON.parse(raw)?.results?.[0];
                if (!hit) return null;
                const authorList = (hit.authorships || []).map(a => a.author.display_name).join(" and ");
                const venue = hit.primary_location?.source?.display_name;
                const pages = (hit.biblio?.first_page && hit.biblio?.last_page) ? `${hit.biblio.first_page}--${hit.biblio.last_page}` : null;
                const match = evaluateMatch(origTitle, origAuthor, hit.title, authorList?.split(" and ")[0], venue);
                if (match) return { source: "OpenAlex", confidence: match.confidence, bibtex: createEnrichedBibtex({ title: hit.title, author: authorList, venue, doi: hit.doi?.replace('https://doi.org/', ''), year: hit.publication_year, pages, url: hit.id }) };
            } catch (e) { logError("OpenAlex", e.message); } return null;
        }

        async function fetchCrossRef(qTitle, qAuthor, origTitle, origAuthor) {
            try {
                const aName = getFirstAuthorLastName(qAuthor);
                const raw = await fetchWithFallback(`https://api.crossref.org/works?query.title=${encodeURIComponent(qTitle)}&select=title,author,container-title,DOI,issued,publisher,URL,abstract&rows=1${aName ? `&query.author=${encodeURIComponent(aName)}`:''}`);
                const hit = JSON.parse(raw)?.message?.items?.[0];
                if (!hit) return null;
                const authorList = (hit.author || []).map(a => `${a.given || ''} ${a.family || ''}`.trim()).join(" and ");
                const venue = hit['container-title']?.[0];
                const match = evaluateMatch(origTitle, origAuthor, hit.title?.[0], authorList?.split(" and ")[0], venue);
                if (match) return { source: "CrossRef", confidence: match.confidence, bibtex: createEnrichedBibtex({ title: hit.title?.[0], author: authorList, venue, doi: hit.DOI, year: hit.issued?.['date-parts']?.[0]?.[0], publisher: hit.publisher, url: hit.URL, abstract: hit.abstract?.replace(/<[^>]*>?/gm, '') }) };
            } catch (e) { logError("CrossRef", e.message); } return null;
        }

        async function fetchSemanticScholar(qTitle, origTitle, origAuthor) {
            try {
                // FIX: Removed invalid fields causing 400 Bad Request
                const safeQ = qTitle.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0,10).join(' ');
                if (!safeQ) return null;

                const raw = await fetchWithFallback(`https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(safeQ)}&fields=title,authors,venue,year,externalIds,abstract,url,citationCount,isOpenAccess&limit=1`);
                const hit = JSON.parse(raw)?.data?.[0];
                if (!hit) return null;
                const authorList = (hit.authors || []).map(a => a.name).join(" and ");
                const venue = hit.venue;
                const match = evaluateMatch(origTitle, origAuthor, hit.title, authorList?.split(" and ")[0], venue);
                if (match) return { source: "Sem. Scholar", confidence: match.confidence, bibtex: createEnrichedBibtex({ title: hit.title, author: authorList, venue, doi: hit.externalIds?.DOI, year: hit.year, abstract: hit.abstract, url: hit.url, note: `Citations: ${hit.citationCount}` }) };
            } catch (e) { logError("Semantic Scholar", e.message); } return null;
        }

        async function fetchArxiv(qTitle, origTitle, origAuthor) {
            try {
                const rawXml = await fetchWithFallback(`https://export.arxiv.org/api/query?search_query=ti:"${encodeURIComponent(qTitle)}"&max_results=1`);
                const xmlDoc = new DOMParser().parseFromString(rawXml, "text/xml");
                const entry = xmlDoc.getElementsByTagName("entry")[0];
                if (!entry) return null;

                const title = entry.getElementsByTagName("title")[0]?.textContent.replace(/\n/g, ' ').trim();
                const authors = Array.from(entry.getElementsByTagName("author")).map(a => a.getElementsByTagName("name")[0].textContent).join(" and ");
                const published = entry.getElementsByTagName("published")[0]?.textContent;
                const year = published ? published.split('-')[0] : null;
                const abstract = entry.getElementsByTagName("summary")[0]?.textContent.replace(/\n/g, ' ').trim();
                const url = entry.getElementsByTagName("id")[0]?.textContent;
                const venue = "arXiv preprint arXiv:" + (url ? url.split('/abs/')[1] : "Unknown");

                const match = evaluateMatch(origTitle, origAuthor, title, authors.split(" and ")[0], venue);
                if (match) return { source: "arXiv API", confidence: match.confidence, bibtex: createEnrichedBibtex({ title, author: authors, venue, year, abstract, url }) };
            } catch (e) { logError("arXiv", e.message); } return null;
        }

        async function fetchUnpaywall(qTitle, origTitle, origAuthor) {
            try {
                const email = document.getElementById('setting-email').value || "dummy-user@example.com";
                const raw = await fetchWithFallback(`https://api.unpaywall.org/v2/search/?query=${encodeURIComponent(qTitle)}&email=${encodeURIComponent(email)}`);
                const data = JSON.parse(raw);
                const hit = data.results?.[0]?.response;
                if (!hit) return null;

                const title = hit.title;
                const venue = hit.journal_name;
                const doi = hit.doi;
                const year = hit.published_date ? hit.published_date.split('-')[0] : null;
                const url = hit.best_oa_location?.url_for_pdf || hit.best_oa_location?.url || null;
                const publisher = hit.publisher;
                
                const match = evaluateMatch(origTitle, origAuthor, title, null, venue);
                if (match) return { source: "Unpaywall", confidence: match.confidence, bibtex: createEnrichedBibtex({ title, author: origAuthor, venue, doi, year, publisher, url, note: "Open Access URL found" }) };
            } catch (e) { logError("Unpaywall", e.message); } return null;
        }

        async function fetchScopus(qTitle, origTitle, origAuthor) {
            try {
                const key = document.getElementById('setting-scopus').value;
                if (!key) { logError("Scopus", "API Key missing. Enter it in Settings."); return null; }

                const raw = await fetchWithFallback(`https://api.elsevier.com/content/search/scopus?query=title(${encodeURIComponent(qTitle)})&apiKey=${encodeURIComponent(key)}`);
                const hit = JSON.parse(raw)?.['search-results']?.entry?.[0];
                if (!hit) return null;

                const title = hit['dc:title'];
                const author = hit['dc:creator'];
                const venue = hit['prism:publicationName'];
                const doi = hit['prism:doi'];
                const year = hit['prism:coverDate'] ? hit['prism:coverDate'].split('-')[0] : null;
                const volume = hit['prism:volume'];
                const pages = hit['prism:pageRange'];
                
                const match = evaluateMatch(origTitle, origAuthor, title, author, venue);
                if (match) return { source: "Scopus", confidence: match.confidence, bibtex: createEnrichedBibtex({ title, author, venue, doi, year, volume, pages, publisher: "Elsevier" }) };
            } catch (e) { logError("Scopus", e.message); } return null;
        }
    </script>
</body>
</html>
