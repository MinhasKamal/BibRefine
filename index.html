    async function safeFetch(url) {
        try {
            const res = await fetch(url);
            if (!res.ok) {
                if (res.status === 429) throw new Error("429 Rate Limited");
                if (res.status === 400) throw new Error("400 Bad Request (Invalid Syntax)");
                throw new Error(`HTTP ${res.status}`);
            }
            return await res.json();
        } catch (e) {
            throw new Error(e.message === "Failed to fetch" ? "Network Error (CORS/Offline)" : e.message);
        }
    }

    function getQualityScore(key, val) {
        let score = 100;
        const str = val.replace(/[{}]/g, '').trim();
        if (key.toLowerCase() === 'author' && /\d/.test(str)) score -= 50;
        if (key.toLowerCase() === 'booktitle' || key.toLowerCase() === 'journal' || key.toLowerCase() === 'publisher') {
            const parts = str.split(/[\/\-]/).map(p => p.trim().toLowerCase()).filter(p => p.length > 8);
            let hasDuplicate = false;
            for (let i = 0; i < parts.length; i++) {
                for (let j = i + 1; j < parts.length; j++) {
                    if (stringSimilarity.compareTwoStrings(parts[i], parts[j]) > 0.7) {
                        hasDuplicate = true; break;
                    }
                }
                if (hasDuplicate) break;
            }
            if (hasDuplicate) score -= 50;
        }
        return score;
    }

    function chooseBestValue(key, val1, val2) {
        if (!val1) return val2;
        if (!val2) return val1;
        const score1 = getQualityScore(key, val1);
        const score2 = getQualityScore(key, val2);
        if (score1 !== score2) return score1 > score2 ? val1 : val2;
        if (val1.length !== val2.length) return val1.length > val2.length ? val1 : val2;
        const caps1 = (val1.match(/[A-Z]/g) || []).length;
        const caps2 = (val2.match(/[A-Z]/g) || []).length;
        if (caps1 !== caps2) return caps1 > caps2 ? val1 : val2;
        return val1; 
    }

    function mergeBibtexEntries(entries) {
        if (!entries || entries.length === 0) return null;
        let mergedType = entries[0].entryType || 'misc';
        let mergedKey = entries[0].citationKey || 'mergedPaper';
        let mergedTags = {};
        const validTypes = entries.map(e => e.entryType).filter(t => t && t.toLowerCase() !== 'misc');
        if (validTypes.length > 0 && mergedType.toLowerCase() === 'misc') mergedType = validTypes[0];
        const validKeys = entries.map(e => e.citationKey).filter(k => k && k !== 'paper');
        if (validKeys.length > 0 && (!mergedKey || mergedKey === 'paper' || mergedKey === 'mergedPaper')) {
            mergedKey = validKeys[0];
        }
        for (let entry of entries) {
            if (!entry.entryTags) continue;
            for (let [key, value] of Object.entries(entry.entryTags)) {
                if (!mergedTags[key]) {
                    mergedTags[key] = value;
                } else {
                    mergedTags[key] = chooseBestValue(key, mergedTags[key], value);
                }
            }
        }
        return { citationKey: mergedKey, entryType: mergedType, entryTags: mergedTags };
    }

    async function runEnrichment() {
        const input = document.getElementById('refiner-input-bib').value;
        const resultsContainer = document.getElementById('results-container');
        const mergedContainer = document.getElementById('merged-container');
        const btn = document.getElementById('enrich-btn');

        resultsContainer.innerHTML = ''; 
        mergedContainer.style.display = 'none';
        clearLogs();
        
        if (!input.trim()) return alert("Please paste some text first.");

        try {
            btn.disabled = true;
            btn.innerHTML = '⏳ Searching...';
            appendLog("Parsing input data...", "info");

            let originalTitle = ""; let originalAuthor = "";
            let inputParsedObj = null;

            try {
                const parsed = bibtexParse.toJSON(input);
                if (parsed && parsed.length > 0 && parsed[0].entryTags) {
                    originalTitle = parsed[0].entryTags.title || "";
                    originalAuthor = parsed[0].entryTags.author || "";
                    inputParsedObj = parsed[0]; 
                    appendLog("Successfully parsed valid BibTeX input.", "success");
                }
            } catch (e) {}

            if (!originalTitle) {
                const lines = input.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length === 0) throw new Error("Input is empty.");
                originalTitle = lines[0]; originalAuthor = lines.length > 1 ? lines[1] : ""; 
                appendLog("Input is not valid BibTeX. Falling back to plain-text heuristics.", "warning");
            }

            const braceFreeTitle = originalTitle.replace(/[{}]/g, '').replace(/[\n\r]/g, ' ').trim();
            const braceFreeAuthor = originalAuthor.replace(/[{}]/g, '').replace(/[\n\r]/g, ' ').trim();

            appendLog(`Initiating queries for: "${braceFreeTitle.substring(0, 40)}..."`, "info");

            const promises = [
                fetchOpenAlex(braceFreeTitle, originalTitle, originalAuthor),
                fetchCrossRef(braceFreeTitle, braceFreeAuthor, originalTitle, originalAuthor),
                fetchOpenAIRE(braceFreeTitle, originalTitle, originalAuthor)
            ];

            const results = await Promise.allSettled(promises);
            let foundAny = false;
            let entriesToMerge = [];

            if (inputParsedObj) entriesToMerge.push(inputParsedObj);

            appendLog("All API requests completed. Analyzing matches...", "info");

            results.forEach(result => {
                if (result.status === 'fulfilled' && result.value) {
                    renderResultCard(result.value);
                    entriesToMerge.push(result.value.bibtex.parsedObj);
                    foundAny = true;
                }
            });

            if (foundAny && entriesToMerge.length > 0) {
                const finalMergedObj = mergeBibtexEntries(entriesToMerge);
                const finalMergedStr = bibtexParse.toBibtex([finalMergedObj], false);
                document.getElementById('merged-bib').value = finalMergedStr;
                mergedContainer.style.display = 'block';
                appendLog("Metadata intelligently merged and ranked.", "success");
            } else {
                appendLog("No valid matches exceeded the 70% fuzzy threshold.", "error");
            }

        } catch (err) {
            appendLog(`Fatal Error: ${err.message}`, "error");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '🔍 Search & Merge';
        }
    }

    function cleanString(str) { return str ? str.replace(/[{}]/g, '').replace(/[\n\r]/g, ' ').replace(/[.,:;'"-]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase() : ""; }
    
    function generateCitationKey(apiAuthor, apiYear) {
        let lastName = "paper";
        if (apiAuthor) {
            let firstAuthor = apiAuthor.split(/\band\b/i)[0].trim();
            lastName = firstAuthor.includes(',') ? firstAuthor.split(',')[0].trim() : firstAuthor.split(/\s+/).pop().trim();
            lastName = lastName.replace(/[^a-zA-Z]/g, '').toLowerCase(); 
        }
        return lastName + (apiYear || "");
    }

    function evaluateMatch(source, originalTitle, originalAuthor, foundTitleRaw, foundAuthorRaw, foundVenue) {
        const foundTitle = cleanString(foundTitleRaw); const foundAuthor = cleanString(foundAuthorRaw);
        const origTitle = cleanString(originalTitle); const origAuthor = cleanString(originalAuthor);
        
        if (!foundTitle || !origTitle) {
            appendLog(`[${source}] Rejected: Missing title in API response.`, "warning");
            return null;
        }
        
        const titleSim = stringSimilarity.compareTwoStrings(origTitle, foundTitle);
        const authorSim = (origAuthor && foundAuthor) ? stringSimilarity.compareTwoStrings(origAuthor, foundAuthor) : 1.0; 
        const score = (titleSim * 0.8) + (authorSim * 0.2);
        
        if (score >= FUZZY_THRESHOLD && foundVenue) {
            appendLog(`[${source}] Accepted: ${Math.round(score * 100)}% match.`, "success");
            return { confidence: Math.round(score * 100) };
        }
        
        appendLog(`[${source}] Rejected: Low score (${Math.round(score * 100)}%) or missing venue.`, "warning");
        return null;
    }

    function createEnrichedBibtex(updates) {
        const newEntry = { citationKey: generateCitationKey(updates.author, updates.year), entryType: 'misc', entryTags: {} };
        if (updates.title) newEntry.entryTags.title = `{${updates.title}}`;
        if (updates.author) newEntry.entryTags.author = `{${updates.author}}`;

        if (updates.venue) {
            const v = updates.venue.toLowerCase();
            if (v.includes('journal') || v.includes('transactions') || v.includes('arxiv')) {
                newEntry.entryType = 'article'; newEntry.entryTags.journal = `{${updates.venue}}`;
            } else {
                newEntry.entryType = 'inproceedings'; newEntry.entryTags.booktitle = `{${updates.venue}}`;
            }
        }

        const mapFields = ['doi', 'year', 'publisher', 'volume', 'number', 'pages', 'url', 'abstract', 'note'];
        mapFields.forEach(f => { if (updates[f]) newEntry.entryTags[f] = `{${updates[f]}}`; });
        
        return {
            rawString: bibtexParse.toBibtex([newEntry], false),
            parsedObj: newEntry
        };
    }

    function renderResultCard(data) {
        const container = document.getElementById('results-container');
        const card = document.createElement('div'); 
        card.className = 'result-card';
        card.innerHTML = `
            <div class="result-header">
                <h3>${data.source}</h3>
                <span class="confidence">${data.confidence}% Match</span>
            </div>
            <textarea readonly>${data.bibtex.rawString}</textarea>
        `;
        container.appendChild(card);
    }

    async function fetchOpenAlex(qTitle, origTitle, origAuthor) {
        appendLog("[OpenAlex] Fetching data...", "info");
        try {
            const safeQ = qTitle.replace(/[^a-zA-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
            if (!safeQ) return null;

            const data = await safeFetch(`https://api.openalex.org/works?filter=title.search:${encodeURIComponent(safeQ)}&per-page=1`);
            const hit = data?.results?.[0];
            if (!hit) {
                appendLog("[OpenAlex] No results found.", "warning");
                return null;
            }

            const authorList = (hit.authorships || []).map(a => a.author.display_name).join(" and ");
            const firstAuthor = authorList.split(" and ")[0];
            const venue = hit.primary_location?.source?.display_name;
            const pages = (hit.biblio?.first_page && hit.biblio?.last_page) ? `${hit.biblio.first_page}--${hit.biblio.last_page}` : null;
            
            const match = evaluateMatch("OpenAlex", origTitle, origAuthor, hit.title, firstAuthor, venue);
            if (match) return { source: "OpenAlex", confidence: match.confidence, bibtex: createEnrichedBibtex({ title: hit.title, author: authorList, venue, doi: hit.doi?.replace('https://doi.org/', ''), year: hit.publication_year, pages, url: hit.id }) };
        } catch (e) { appendLog(`[OpenAlex] Error: ${e.message}`, "error"); } return null;
    }

    async function fetchCrossRef(qTitle, qAuthor, origTitle, origAuthor) {
        appendLog("[CrossRef] Fetching data...", "info");
        try {
            const safeQ = qTitle.replace(/[^a-zA-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
            if (!safeQ) return null;

            const aName = getFirstAuthorLastName(qAuthor);
            let url = `https://api.crossref.org/works?query.title=${encodeURIComponent(safeQ)}&select=title,author,container-title,DOI,issued,publisher,URL,abstract&rows=1`;
            if (aName) url += `&query.author=${encodeURIComponent(aName)}`;

            const data = await safeFetch(url);
            const hit = data?.message?.items?.[0];
            if (!hit) {
                appendLog("[CrossRef] No results found.", "warning");
                return null;
            }

            const hitTitle = hit.title?.[0];
            const authorList = (hit.author || []).map(a => `${a.given || ''} ${a.family || ''}`.trim()).join(" and ");
            const firstAuthor = authorList.split(" and ")[0];
            const venue = hit['container-title']?.[0];
            
            const match = evaluateMatch("CrossRef", origTitle, origAuthor, hitTitle, firstAuthor, venue);
            if (match) return { source: "CrossRef", confidence: match.confidence, bibtex: createEnrichedBibtex({ title: hitTitle, author: authorList, venue, doi: hit.DOI, year: hit.issued?.['date-parts']?.[0]?.[0], publisher: hit.publisher, url: hit.URL, abstract: hit.abstract?.replace(/<[^>]*>?/gm, '') }) };
        } catch (e) { appendLog(`[CrossRef] Error: ${e.message}`, "error"); } return null;
    }

    async function fetchOpenAIRE(qTitle, origTitle, origAuthor) {
        appendLog("[OpenAIRE] Fetching data...", "info");
        try {
            const safeQ = qTitle.replace(/[^a-zA-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
            if (!safeQ) return null;

            const data = await safeFetch(`https://api.openaire.eu/search/publications?title=${encodeURIComponent(safeQ)}&format=json&size=1`);
            const results = data?.response?.results?.result;
            if (!results || results.length === 0) {
                appendLog("[OpenAIRE] No results found.", "warning");
                return null;
            }
            
            const metadata = results[0]?.metadata?.["oaf:entity"]?.["oaf:result"];
            if (!metadata) return null;

            const titleObj = metadata.title;
            const hitTitle = Array.isArray(titleObj) ? titleObj[0]?.["\$"] : titleObj?.["\$"];
            
            let authorList = "";
            if (metadata.creator) {
                const creators = Array.isArray(metadata.creator) ? metadata.creator : [metadata.creator];
                authorList = creators.map(c => c["$"] || c.name || c.surname).join(" and ");
            }
            const firstAuthor = authorList.split(" and ")[0];
            
            const venueObj = metadata.journal || metadata.publisher;
            const venue = Array.isArray(venueObj) ? venueObj[0]?.["\$"] || venueObj[0]?.name : venueObj?.["\$"] || venueObj?.name;
            
            let doi = null;
            if (metadata.pid) {
                const pids = Array.isArray(metadata.pid) ? metadata.pid : [metadata.pid];
                const doiObj = pids.find(p => p["@classid"] === "doi");
                if (doiObj) doi = doiObj["$"];
            }

            let year = null;
            if (metadata.dateofacceptance?.["$"]) {
                year = metadata.dateofacceptance["$"].substring(0, 4);
            }

            let abstract = metadata.description?.["\$"] || (Array.isArray(metadata.description) ? metadata.description[0]?.["\$"] : null);

            const match = evaluateMatch("OpenAIRE", origTitle, origAuthor, hitTitle, firstAuthor, venue);
            if (match) {
                return {
                    source: "OpenAIRE",
                    confidence: match.confidence,
                    bibtex: createEnrichedBibtex({ title: hitTitle, author: authorList, venue: venue, doi: doi, year: year, abstract: abstract })
                };
            }
        } catch (e) { appendLog(`[OpenAIRE] Error: ${e.message}`, "error"); } return null;
    }
    
    // --- Draggable Resizer Logic ---
    function setupResizer(resizerId, targetId, isLeftSidebar) {
        const resizer = document.getElementById(resizerId);
        const target = document.getElementById(targetId);
        let startX, startWidth;

        resizer.addEventListener('mousedown', function(e) {
            startX = e.clientX;
            startWidth = parseInt(window.getComputedStyle(target).width, 10);
            
            document.documentElement.addEventListener('mousemove', doDrag, false);
            document.documentElement.addEventListener('mouseup', stopDrag, false);
            
            resizer.classList.add('dragging');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none'; // Prevent text highlighting while dragging
        });

        function doDrag(e) {
            if (isLeftSidebar) {
                // Dragging left sidebar changes its width relative to the left edge
                target.style.width = (startWidth + e.clientX - startX) + 'px';
            } else {
                // Dragging right sidebar changes its width inverted
                target.style.width = (startWidth - e.clientX + startX) + 'px';
            }
        }

        function stopDrag(e) {
            document.documentElement.removeEventListener('mousemove', doDrag, false);
            document.documentElement.removeEventListener('mouseup', stopDrag, false);
            
            resizer.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        }
    }

    // Initialize resizers
    setupResizer('resizer-left', 'left-sidebar', true);
    setupResizer('resizer-right', 'right-sidebar', false);

    // Initialize the app
    updateHighlighting();
    
    function forceWhitespaceInput(elementId) {
        const input = document.getElementById(elementId);

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' || event.key === 'Delete' ||
               event.key === 'ArrowLeft'|| event.key === 'ArrowRight') {
                return;
            }
            
            // Prevent the browser from moving focus to the next field
            e.preventDefault();
            // Get current cursor selection positions
            const start = this.selectionStart;
            const end = this.selectionEnd;
            
            let char = " ";
            // Check if the pressed key is Tab (KeyCode 9 or key 'Tab')
            if (e.key === 'Tab' || e.keyCode === 9) {
                char = "\t";
            }

            // Insert the tab character at the current cursor position
            this.value = this.value.substring(0, start) + char + this.value.substring(end);

            // Move the cursor right after the newly inserted tab character
            this.selectionStart = this.selectionEnd = start + 1;
        });
    }

    forceWhitespaceInput('indentation');
</script>
